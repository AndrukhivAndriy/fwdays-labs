apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fwdays-policies
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/AndrukhivAndriy/fwdays-labs.git
    targetRevision: dev
    path: lab2
    helm:
      releaseName: fwdays-policies
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
