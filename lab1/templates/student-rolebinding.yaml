{{- range .Values.students }}
{{- $student := .name }}
{{- range .access }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $student }}-{{ .role }}
  namespace: {{ .namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ $student }}
    namespace: {{ $student }}
roleRef:
  kind: ClusterRole
  name: lab-{{ .role }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
