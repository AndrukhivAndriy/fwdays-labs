apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-istio
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/AndrukhivAndriy/fwdays-labs.git
    targetRevision: dev
    path: lab3
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
